services:
  db:
    image: postgres:17-alpine
    container_name: taskhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taskhub}
    volumes:
      - taskhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE}
    container_name: taskhub-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taskhub}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-https://taskhub.yuohira.com}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3009}:3000"

volumes:
  taskhub-pgdata:
